name: Update Profile Cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - README.md
      - .github/workflows/profile-cards.yml
      - .github/scripts/generate_streak_card.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: Julio Azancort
          THEME: github_dark
          EXCLUDE: Roff
          UTC_OFFSET: -3
          AUTO_PUSH: false

      - name: Generate streak SVG card
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate_streak_card.py

      - name: Publish SVG cards to cards branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cards-tmp
          git reset
          git add -f profile-summary-card-output/
          git commit -m "profile: update activity and streak SVG cards"
          git push -f origin cards-tmp:cards
